<h2>Course List</h2>

<!-- Selected Course ID -->
<p *ngIf="selectedCourseId !== null">
    <strong>Selected Course ID: {{ selectedCourseId }}</strong>
</p>

<!-- Loading Message -->
<p *ngIf="isLoading">
    Loading courses...
</p>

<div *ngIf="!isLoading">

    <div *ngIf="courses.length > 0; else noCourses">

        <app-course-card
            *ngFor="let course of courses; let i = index; trackBy: trackByCourseId"
            [course]="course"
            (enrollRequested)="onEnroll($event)">
        </app-course-card>

    </div>

</div>

<ng-template #noCourses>
    <p>No courses available.</p>
</ng-template>
